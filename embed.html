<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ETHval — ETH fair value</title>
<link rel="canonical" href="https://ethval.com/">
<!--
  ETHval embed card (2026-10-14). Usage:
    <iframe src="https://ethval.com/embed.html?lang=ko&theme=light" width="100%" height="236"
            style="border:0;max-width:480px" title="ETHval" loading="lazy"></iframe>
  Numbers are NOT recomputed here. The card loads the real dashboard (same origin, hidden, ?embed=1)
  and copies exactly what it shows: market price, composite fair value (12-model simple mean), gap,
  and the last successful collector run from scheduler_logs. If the dashboard does not finish loading
  the card says so and shows no numbers (never estimated, never filled).
-->
<style>
  :root { --bg:#ffffff; --card:#f6f7f9; --text:#111827; --sub:#4b5563; --line:#e5e7eb; --accent:#4f46e5; --up:#15803d; --down:#b91c1c; }
  html.dark { --bg:#0f1115; --card:#181b22; --text:#f3f4f6; --sub:#a3aab8; --line:#2a2f3a; --accent:#a5b4fc; --up:#4ade80; --down:#f87171; }
  * { box-sizing:border-box; margin:0; }
  html, body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Hiragino Sans","PingFang SC",sans-serif; }
  body { padding:12px; }
  .card { border:1px solid var(--line); border-radius:14px; background:var(--card); padding:14px 16px 12px; max-width:480px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .brand { font-weight:700; font-size:14px; letter-spacing:.02em; color:var(--text); text-decoration:none; }
  .brand b { color:var(--accent); }
  .label { font-size:12px; color:var(--sub); white-space:nowrap; }
  .row { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-rows:auto auto; grid-auto-flow:column; column-gap:10px; margin-top:12px; }
  .cell { display:contents; }
  .k { font-size:12px; color:var(--sub); line-height:1.3; word-break:keep-all; align-self:end; }
  .v { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.25; margin-top:2px; white-space:nowrap; }
  .v.fv { color:var(--accent); }
  .v.up { color:var(--up); } .v.down { color:var(--down); }
  .foot { margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font-size:12px; color:var(--sub); line-height:1.5; }
  #stamp { display:flex; flex-wrap:wrap; column-gap:10px; }
  .foot a { display:inline-block; margin-top:4px; }
  #stamp span { white-space:nowrap; } #stamp span:first-child { white-space:normal; word-break:keep-all; flex-basis:100%; }
  .foot a { color:var(--accent); text-decoration:none; font-weight:600; white-space:nowrap; }
  .msg { margin-top:12px; font-size:13px; color:var(--sub); min-height:46px; }
  @media (max-width:360px) { .v { font-size:17px; } .row { column-gap:6px; } }
  #src { position:absolute; width:1280px; height:900px; left:-99999px; top:0; border:0; visibility:hidden; }
</style>
</head>
<body>
<div class="card" id="card" aria-live="polite">
  <div class="top">
    <a class="brand" id="brand" href="https://ethval.com/" target="_blank" rel="noopener">ETH<b>val</b></a>
    <span class="label" id="title"></span>
  </div>
  <div class="msg" id="msg"></div>
  <div class="row" id="vals" hidden>
    <div class="cell"><div class="k" id="k-price"></div><div class="v" id="v-price"></div></div>
    <div class="cell"><div class="k" id="k-fv"></div><div class="v fv" id="v-fv"></div></div>
    <div class="cell"><div class="k" id="k-gap"></div><div class="v" id="v-gap"></div></div>
  </div>
  <div class="foot">
    <span id="stamp"></span>
    <a id="more" href="https://ethval.com/" target="_blank" rel="noopener"></a>
  </div>
</div>
<script>
(function () {
  'use strict';
  var qs = new URLSearchParams(location.search);
  var L = (qs.get('lang') || 'en').toLowerCase().slice(0, 2); if (L === 'kr') L = 'ko';
  if (['en', 'ko', 'zh', 'ja'].indexOf(L) < 0) L = 'en';
  var theme = qs.get('theme') === 'dark' ? 'dark' : 'light';
  document.documentElement.lang = L;
  if (theme === 'dark') document.documentElement.classList.add('dark');
  var HASH = { en: '', ko: '#kr', zh: '#zh', ja: '#ja' };
  var T = {
    en: { title: 'ETH fair value', price: 'ETH price', fv: 'Fair value', basis: 'Fair value = average of 12 valuation models.', gap: 'Gap', more: 'Full analysis ↗',
          loading: 'Loading the live dashboard…', fail: 'Could not load live data. Open ethval.com for the latest numbers.',
          data: 'Data updated', at: 'Price at' },
    ko: { title: 'ETH 적정가', price: 'ETH 현재가', fv: '합성 적정가', basis: '합성 적정가 = 12개 가치평가 모델의 평균.', gap: '괴리율', more: '전체 분석 보기 ↗',
          loading: '실시간 대시보드를 불러오는 중…', fail: '실시간 데이터를 불러오지 못했어. 최신 수치는 ethval.com에서 확인해줘.',
          data: '데이터 업데이트', at: '가격 기준' },
    zh: { title: 'ETH 公允价值', price: 'ETH 现价', fv: '综合公允价值', basis: '综合公允价值 = 12 个估值模型的平均值。', gap: '偏离率', more: '查看完整分析 ↗',
          loading: '正在加载实时仪表板…', fail: '无法加载实时数据，请在 ethval.com 查看最新数值。',
          data: '数据更新', at: '价格时间' },
    ja: { title: 'ETH 適正価格', price: 'ETH 現在価格', fv: '合成適正価格', basis: '合成適正価格 = 12 の評価モデルの平均。', gap: '乖離率', more: '詳しい分析を見る ↗',
          loading: 'ライブダッシュボードを読み込み中…', fail: 'ライブデータを読み込めなかった。最新の数値は ethval.com で確認して。',
          data: 'データ更新', at: '価格時点' }
  }[L];
  var $ = function (id) { return document.getElementById(id); };
  var site = 'https://ethval.com/?utm_source=embed&utm_medium=iframe' + HASH[L];
  $('brand').href = site; $('more').href = site;
  $('title').textContent = T.title; $('more').textContent = T.more;
  $('k-price').textContent = T.price; $('k-fv').textContent = T.fv; $('k-gap').textContent = T.gap;
  $('msg').textContent = T.loading;

  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function stamp(d) { // ISO date + UTC, same instant for every reader of the article
    return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()) + ' ' + p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + ' UTC';
  }
  function money(v) { return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
  function fail() { cleanup(); $('msg').hidden = false; $('vals').hidden = true; $('msg').textContent = T.fail; $('card').dataset.state = 'error'; }
  function show(r) {
    cleanup();
    $('v-price').textContent = money(r.price);
    $('v-fv').textContent = money(r.fv);
    var gap = (r.fv / r.price - 1) * 100; // same definition as the dashboard's upside line
    var g = $('v-gap'); g.textContent = (gap >= 0 ? '+' : '−') + Math.abs(gap).toFixed(1) + '%';
    g.className = 'v ' + (gap >= 0 ? 'up' : 'down');
    var st = $('stamp'); st.textContent = '';
    [T.basis, r.run ? T.data + ' ' + stamp(r.run) : null, T.at + ' ' + stamp(new Date())].forEach(function (x) {
      if (!x) return; var sp = document.createElement('span'); sp.textContent = x; st.appendChild(sp); st.appendChild(document.createTextNode(' '));
    });
    $('msg').hidden = true; $('vals').hidden = false; $('card').dataset.state = 'ready';
    $('card').dataset.fv = r.fv; $('card').dataset.price = r.price; $('card').dataset.gap = gap.toFixed(1);
  }
  var frame = document.createElement('iframe');
  frame.id = 'src'; frame.setAttribute('aria-hidden', 'true'); frame.tabIndex = -1;
  frame.src = 'index.html?embed=1' + HASH[L];
  document.body.appendChild(frame);
  // drop the hidden dashboard as soon as numbers are copied (no background polling/websocket left in the host page)
  function cleanup() { clearInterval(iv); if (frame.parentNode) frame.remove(); }
  var t0 = Date.now(), last = null, sameSince = 0;
  var iv = setInterval(function () {
    var r = null;
    try {
      var w = frame.contentWindow, d = frame.contentDocument;
      var ok = w && d && w.eval('typeof state !== "undefined" && state.historicalDataLoaded === true && state.price > 0 && !window.__ethvalSnapshotRender');
      if (ok) {
        var n = function (id) { var e = d.getElementById(id); return e ? +String(e.textContent).replace(/[^0-9.]/g, '') : 0; };
        var fv = n('composite-price'), cards = d.querySelectorAll('.valuation-model[data-model]').length;
        var lr = w.EthvalExtras && w.EthvalExtras.lastRun ? w.EthvalExtras.lastRun() : null;
        if (fv > 0 && cards >= 12) r = { fv: fv, price: +w.eval('state.price'), run: lr };
      }
    } catch (e) { /* not ready yet */ }
    if (r) {
      var key = r.fv + '|' + r.price + '|' + (r.run ? r.run.getTime() : '');
      if (key !== last) { last = key; sameSince = Date.now(); }
      else if (Date.now() - sameSince >= 1500 && (r.run || Date.now() - t0 > 15000)) return show(r);
    }
    if (Date.now() - t0 > 30000) fail();
  }, 300);
})();
</script>
</body>
</html>
