# .github/workflows/collect-historical-data.yml
# ETHval Historical Data Collection
# 수동 실행 전용 (정기 수집은 collect-data.yml)

name: Collect Historical Data

on:
  # 2026-10-15: 자동 실행 제거 — collect-data.yml(30 4,16 * * *)과 같은 data-collector.js를
  # 같은 시각에 동시에 돌려 Dune 대기가 겹치고 collect-data가 30분 제한에 걸려 취소됨
  # (run 38543858211). 정기 수집은 collect-data.yml 하나만 담당. 수동 실행만 남김.
  workflow_dispatch:

concurrency:
  group: ethval-data-collector
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
 
permissions:
  contents: read
  actions: write

jobs:
  collect-data:
    name: Collect Historical Data
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run data collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "🚀 Starting ETHval data collection v7.1..."
          echo "📊 Collecting 40 datasets (29 API + 11 Dune)"
          echo "📌 Dune queries auto-refresh daily at 03:30-04:00 UTC"
          echo "🤖 AI commentary generation enabled"
          node scripts/data-collector.js
      
      - name: Summary
        if: always()
        run: |
          echo "## 📊 Data Collection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Run time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Check Supabase or admin page for details" >> $GITHUB_STEP_SUMMARY

      # GitHub disables scheduled workflows after 60 days without repo activity
      # (this stopped data collection on 2026-04-28). Re-enabling via the API
      # resets that timer on every run.
      - name: Keep scheduled workflows alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in collect-data.yml collect-historical-data.yml smoke-check.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" || true
          done
