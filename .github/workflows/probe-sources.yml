name: probe-sources
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: L1 total volume spike probe (aggregates only)
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: node .github/probe/l1vol_probe.cjs
