name: probe-sources
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: L2 stablecoin volume probe (row counts only)
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: node .github/probe/stablevol_probe.cjs
