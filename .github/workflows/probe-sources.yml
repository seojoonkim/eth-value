name: probe-sources
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reachability from GitHub runners (OI history sources)
        run: |
          p() { printf '%-28s ' "$1"; curl -s -m 20 -o /tmp/o -w "%{http_code} %{size_download}B " "$2"; head -c 160 /tmp/o | tr '\n' ' '; echo; }
          p binance_vision_um  "https://data.binance.vision/data/futures/um/daily/metrics/ETHUSDT/ETHUSDT-metrics-2026-10-08.zip"
          p binance_vision_cm  "https://data.binance.vision/data/futures/cm/daily/metrics/ETHUSD_PERP/ETHUSD_PERP-metrics-2026-10-08.zip"
          p binance_fapi_hist  "https://fapi.binance.com/futures/data/openInterestHist?symbol=ETHUSDT&period=1d&limit=2"
          p bybit_oi           "https://api.bybit.com/v5/market/open-interest?category=linear&symbol=ETHUSDT&intervalTime=1d&limit=2"
          p okx_rubik          "https://www.okx.com/api/v5/rubik/stat/contracts/open-interest-volume?ccy=ETH&period=1D"
          p deribit_book       "https://www.deribit.com/api/v2/public/get_book_summary_by_currency?currency=ETH&kind=future"
          p coingecko_deriv    "https://api.coingecko.com/api/v3/derivatives/exchanges?per_page=3"
