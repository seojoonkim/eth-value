name: Site Smoke Check

# Loads https://ethval.com in a real browser and fails if the headline
# valuation shows NaN, a model has no price, or TVL / L2 TVL are zero,
# and fails when any data table the site reads stops advancing (freshness gate).
# A failed run triggers GitHub's default failure email to the repo owner.
on:
  schedule:
    - cron: '0 6 * * *'   # UTC 06:00, after the 04:30 collection
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm i --no-save playwright@1.58 && npx playwright install --with-deps chromium
      - name: Smoke check
        run: node scripts/smoke-check.js "https://ethval.com/?cb=${{ github.run_id }}"
      - name: Data freshness
        if: always()
        run: node scripts/freshness-check.js
      - name: Chart audit (every chart has real data)
        if: always()
        run: node scripts/chart-audit.js "https://ethval.com/?cb=${{ github.run_id }}"
